<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jobbot — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-1: #38BDF8; --sky-2: #0EA5E9; --sky-deep: #0369A1;
    --red: #EF4444; --yellow: #FBBF24;
    --bg: #F9FAFB; --panel: #FFFFFF; --line: #E5E7EB; --text: #1F2937; --muted: #6B7280;
    --approve: #059669; --approve-bg: #ECFDF5; --reject: #DC2626; --reject-bg: #FEF2F2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  h1, h2 { font-family: 'Source Serif 4', serif; font-weight: 700; }
  header { background: linear-gradient(135deg, var(--sky-1) 0%, var(--sky-2) 100%); color: white; padding: 20px 32px; display:flex; justify-content:space-between; align-items:center; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo-badge { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, var(--red), var(--yellow)); display:flex; align-items:center; justify-content:center; }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header a { color: white; font-size: 13px; text-decoration: none; font-weight: 700; }
  header a:hover { text-decoration: underline; }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 32px 80px; }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .stat .num { font-family: 'Source Serif 4', serif; font-size: 24px; font-weight: 700; }
  .stat.accent .num { color: var(--reject); }
  .stat .label { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
  .panel h2 { font-size: 16px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  tr:last-child td { border-bottom: none; }
  tr.user-row { cursor: pointer; }
  tr.user-row:hover { background: #F8F9FC; }
  .badge { padding: 2px 9px; border-radius: 100px; font-size: 11px; font-weight: 700; }
  .badge.ok { background: var(--approve-bg); color: var(--approve); }
  .badge.bad { background: var(--reject-bg); color: var(--reject); }
  button.primary {
    background: linear-gradient(135deg, var(--red), var(--yellow)); color: white; border: none; padding: 9px 16px; border-radius: 7px;
    font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: transform 0.15s;
    box-shadow: 0 4px 12px rgba(239,68,68,0.2);
  }
  button.primary:hover { transform: translateY(-1px); }
  .meta-line { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  #userDetail { display: none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M8 5h8l4 4v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="#FFFFFF"/>
        <path d="M16 5l4 4h-4z" fill="#FEF3C7"/>
        <path d="M10 13l2.5 2.5 4.5-4.5" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>jobbot — Admin</h1>
  </div>
  <a href="/">&larr; Back to dashboard</a>
</header>
<main>
  <div class="stats-row" id="statsRow"></div>

  <div class="panel">
    <h2>Job pool</h2>
    <div class="meta-line" id="poolMeta"></div>
    <button class="primary" id="refreshPoolBtn">Refresh job pool now</button>
    <span id="refreshStatus" style="font-size:13px; color:var(--muted); margin-left:10px;"></span>
  </div>

  <div class="panel">
    <h2>Users</h2>
    <table id="usersTable">
      <thead><tr><th>Email</th><th>Name</th><th>Signed up</th><th>Setup</th><th>Applications</th><th>Failures</th><th>Admin</th></tr></thead>
      <tbody id="usersTableBody"></tbody>
    </table>
  </div>

  <div class="panel" id="userDetail">
    <h2 id="userDetailTitle">User applications</h2>
    <table>
      <thead><tr><th>Date</th><th>Role</th><th>Company</th><th>Method</th><th>Status</th><th>ATS</th><th>Link</th></tr></thead>
      <tbody id="userDetailBody"></tbody>
    </table>
  </div>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

async function loadOverview() {
  const res = await fetch('/api/admin/overview');
  const s = await res.json();
  const stats = [
    ['Users', s.user_count, false], ['Applications sent', s.total_applications, false],
    ['Emails sent', s.emails_sent, false], ['Email failures', s.email_failures, s.email_failures > 0],
  ];
  $('#statsRow').innerHTML = stats.map(([label, num, accent]) => `<div class="stat${accent ? ' accent' : ''}"><div class="num">${num}</div><div class="label">${label}</div></div>`).join('');
  $('#poolMeta').textContent = `${s.job_pool_size} postings in the shared pool` +
    (s.last_refresh ? `, last refresh: ${s.last_refresh.finished_at || 'in progress'} (${s.last_refresh.new_count ?? 0} new)` : ', never refreshed yet');
}

async function loadUsers() {
  const res = await fetch('/api/admin/users');
  const data = await res.json();
  const tbody = $('#usersTableBody');
  tbody.innerHTML = '';
  data.users.forEach(u => {
    const tr = document.createElement('tr');
    tr.className = 'user-row';
    tr.innerHTML = `
      <td>${escapeHtml(u.email)}</td>
      <td>${escapeHtml(u.name)}</td>
      <td>${escapeHtml((u.created_at || '').slice(0,10))}</td>
      <td>${u.setup_complete ? '<span class="badge ok">Complete</span>' : '<span class="badge bad">Incomplete</span>'}</td>
      <td>${u.applications}</td>
      <td>${u.failures > 0 ? `<span class="badge bad">${u.failures}</span>` : '0'}</td>
      <td>${u.is_admin ? '<span class="badge ok">Admin</span>' : ''}</td>`;
    tr.addEventListener('click', () => loadUserDetail(u.id, u.email));
    tbody.appendChild(tr);
  });
}

async function loadUserDetail(userId, email) {
  const res = await fetch(`/api/admin/user/${userId}/applications`);
  const data = await res.json();
  $('#userDetail').style.display = 'block';
  $('#userDetailTitle').textContent = `Applications — ${email}`;
  const tbody = $('#userDetailBody');
  tbody.innerHTML = '';
  if (!data.rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="color:var(--muted);">No applications yet.</td></tr>';
  }
  data.rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml((r.applied_at || '').slice(0,10))}</td>
      <td>${escapeHtml(r.title)}</td>
      <td>${escapeHtml(r.company)}</td>
      <td>${escapeHtml(r.apply_method)}</td>
      <td>${escapeHtml(r.status)}</td>
      <td>${r.ats_score ? r.ats_score + '%' : '—'}</td>
      <td>${r.url ? `<a href="${r.url}" target="_blank" rel="noopener">Open</a>` : '—'}</td>`;
    tbody.appendChild(tr);
  });
  $('#userDetail').scrollIntoView({ behavior: 'smooth' });
}

$('#refreshPoolBtn').addEventListener('click', async () => {
  const btn = $('#refreshPoolBtn');
  btn.disabled = true; btn.textContent = 'Refreshing…';
  $('#refreshStatus').textContent = '';
  try {
    const res = await fetch('/api/admin/refresh_pool', { method: 'POST' });
    const data = await res.json();
    if (data.error) { $('#refreshStatus').textContent = 'Failed: ' + data.error; }
    else { $('#refreshStatus').textContent = `Done — ${data.raw_count} fetched, ${data.new_count} new.`; loadOverview(); }
  } catch (e) { $('#refreshStatus').textContent = 'Failed - check server logs.'; }
  btn.disabled = false; btn.textContent = 'Refresh job pool now';
});

loadOverview();
loadUsers();
</script>
</body>
</html>
