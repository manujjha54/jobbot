<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobBot | Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      --accent: #06b6d4;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 50%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.25rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      background: var(--primary-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    .logo-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .admin-badge {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .nav-link:hover {
      color: var(--text);
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .btn-action {
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 11px 20px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.92rem;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
      transition: opacity 0.2s;
    }

    .btn-action:hover {
      opacity: 0.92;
    }

    .status-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      margin-top: 1.25rem;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <a href="/" style="display:flex; align-items:center; gap:14px; text-decoration:none;">
        <div class="logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div>
          <div class="logo-title">JobBot Admin</div>
        </div>
      </a>
      <span class="admin-badge">ADMIN CONSOLE</span>
    </div>

    <div class="nav-actions">
      <a href="/" class="nav-link">← Back to Dashboard</a>
      <button type="button" class="btn-logout" onclick="handleLogout()">Sign Out</button>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2 style="font-size: 1.35rem; margin-bottom: 0.5rem;">Job Pool Management</h2>
      <p style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 1.5rem;">Fetch and ingest fresh job listings from connected providers into the central pool.</p>
      
      <form id="refresh-pool-form">
        <button type="submit" id="refresh-btn" class="btn-action">Refresh Job Pool Now</button>
      </form>

      <div id="refresh-status" class="status-banner"></div>
    </div>
  </main>

  <script>
    // Logout Handler
    async function handleLogout() {
      try {
        await fetch('/api/logout', { method: 'POST' });
      } catch (err) {
        console.error('Logout error:', err);
      } finally {
        window.location.href = '/login';
      }
    }

    // Refresh Pool Handler
    document.getElementById('refresh-pool-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('refresh-btn');
      const statusBox = document.getElementById('refresh-status');

      btn.disabled = true;
      btn.innerText = 'Fetching Jobs...';
      statusBox.style.display = 'block';
      statusBox.style.background = 'rgba(99, 102, 241, 0.15)';
      statusBox.style.color = '#c7d2fe';
      statusBox.innerText = 'Connecting to job boards and updating candidate pool...';

      try {
        const res = await fetch('/api/admin/refresh_pool', { method: 'POST' });
        const data = await res.json();

        if (res.ok && data.ok) {
          statusBox.style.background = 'rgba(16, 185, 129, 0.15)';
          statusBox.style.color = '#6ee7b7';
          statusBox.innerText = `Job pool successfully updated! Added ${data.new_count || 0} new job postings (${data.raw_count || 0} total fetched).`;
        } else {
          statusBox.style.background = 'rgba(239, 68, 68, 0.15)';
          statusBox.style.color = '#fca5a5';
          statusBox.innerText = data.error || 'Failed to refresh job pool.';
        }
      } catch (err) {
        statusBox.style.background = 'rgba(239, 68, 68, 0.15)';
        statusBox.style.color = '#fca5a5';
        statusBox.innerText = 'Network error while refreshing job pool.';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Refresh Job Pool Now';
      }
    });
  </script>

</body>
</html>
