<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jobbot — Smarter resumes. Faster applications.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1240; --indigo: #4F46E5; --violet: #7C3AED; --pink: #EC4899;
    --paper: #F7F6FD; --panel: #FFFFFF; --line: #E5E1F7; --muted: #6B6478;
    --reject: #EF4444; --reject-bg: #FEF2F2;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif; color: var(--ink); margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 55%, #A855F7 100%);
    background-attachment: fixed;
  }
  .card {
    background: var(--panel); border-radius: 20px; width: 400px; padding: 40px 38px 34px;
    box-shadow: 0 24px 60px rgba(20, 10, 60, 0.35);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .logo-badge {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    display: flex; align-items: center; justify-content: center;
  }
  .wordmark { font-family: 'Source Serif 4', serif; font-size: 21px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .tagline { font-size: 12px; color: var(--muted); margin-top: 3px; }
  h1 { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; margin: 0 0 22px; color: var(--ink); }
  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
  input {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 10px;
    font-size: 14px; font-family: inherit; margin-bottom: 16px; color: var(--ink); background: var(--paper);
    transition: border-color 0.15s;
  }
  input:focus { outline: none; border-color: var(--indigo); background: white; }
  .hint { font-size: 12px; color: var(--muted); margin: -10px 0 16px; }
  button {
    width: 100%; color: white; border: none; padding: 13px; border-radius: 10px;
    font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(79, 70, 229, 0.45); }
  .error {
    color: var(--reject); font-size: 13px; margin-bottom: 14px; display: none;
    padding: 9px 12px; background: var(--reject-bg); border-radius: 8px; font-weight: 500;
  }
  .footer-link { text-align: center; font-size: 13px; margin-top: 22px; color: var(--muted); }
  .footer-link a { color: var(--indigo); font-weight: 700; text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo-badge">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M8 5h8l4 4v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="white"/>
        <path d="M16 5l4 4h-4z" fill="#D7D3FF"/>
        <path d="M10 13l2.5 2.5 4.5-4.5" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="wordmark">jobbot</div>
      <div class="tagline">Smarter resumes. Faster applications. Zero hassle.</div>
    </div>
  </div>
  <h1>Create your account</h1>
  <div class="error" id="err"></div>
  <label for="name">Name</label>
  <input type="text" id="name" autocomplete="name">
  <label for="email">Email</label>
  <input type="email" id="email" autocomplete="email">
  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="new-password">
  <div class="hint">At least 8 characters.</div>
  <button id="signupBtn">Create account</button>
  <div class="footer-link">Already have an account? <a href="/login">Log in</a></div>
</div>
<script>
document.getElementById('signupBtn').addEventListener('click', async () => {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  try {
    const res = await fetch('/api/signup', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, email, password})
    });
    const data = await res.json();
    if (data.error) { err.textContent = data.error; err.style.display = 'block'; }
    else { window.location.href = '/'; }
  } catch (e) { err.textContent = 'Something went wrong. Try again.'; err.style.display = 'block'; }
});
document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('signupBtn').click();
});
</script>
</body>
</html>
