<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jobbot — Smarter resumes. Faster applications.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-1: #38BDF8; --sky-2: #0EA5E9;
    --red: #EF4444; --red-soft: #F87171; --red-pink: #FCA5A5;
    --yellow: #FBBF24; --yellow-bright: #FDE047; --yellow-pale: #FEF08A;
    --error: #FCA5A5; --error-bg: rgba(220,38,38,0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', -apple-system, sans-serif; color: white;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px;
    background: linear-gradient(135deg, var(--sky-1) 0%, var(--sky-2) 100%);
  }
  .page { position: relative; max-width: 680px; width: 100%; padding: 1rem; }

  .brand { position: relative; display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  .logo-badge {
    width: 54px; height: 54px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--red), var(--yellow));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  }
  .wordmark { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 25px; margin: 0; color: white; letter-spacing: -0.01em; }
  .tagline { font-size: 13.5px; margin: 3px 0 0; font-weight: 700; color: var(--yellow-pale); }

  .body-grid { position: relative; margin: 32px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: start; }

  .flow-label-hdr { font-size: 10px; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 14px; }
  .scroller { position: relative; height: 96px; }
  .scroll-step {
    position: absolute; top: 0; left: 0; width: 100%; padding-left: 12px;
    animation: stepCycle 12s infinite; opacity: 0;
  }
  .scroll-step:nth-child(1) { animation-delay: 0s; border-left: 3px solid var(--yellow-bright); }
  .scroll-step:nth-child(2) { animation-delay: 3s; border-left: 3px solid var(--red-pink); }
  .scroll-step:nth-child(3) { animation-delay: 6s; border-left: 3px solid var(--red-soft); }
  .scroll-step:nth-child(4) { animation-delay: 9s; border-left: 3px solid var(--yellow-bright); }
  @keyframes stepCycle {
    0%   { opacity: 0; transform: translateY(6px); }
    8%   { opacity: 1; transform: translateY(0); }
    17%  { opacity: 1; transform: translateY(0); }
    25%  { opacity: 0; transform: translateY(-6px); }
    100% { opacity: 0; transform: translateY(-6px); }
  }
  .step-num { font-size: 12px; font-weight: 800; }
  .step-num.n1, .step-num.n4 { color: var(--yellow-bright); }
  .step-num.n2 { color: var(--red-pink); }
  .step-num.n3 { color: var(--red-soft); }
  .step-text { font-size: 16px; color: white; margin: 6px 0 0; line-height: 1.4; }
  .step-text.highlight { font-weight: 600; }

  h2 { font-size: 14px; font-weight: 600; margin: 0 0 18px; color: white; }
  label { display: block; font-size: 10px; font-weight: 700; margin-bottom: 5px; color: rgba(255,255,255,0.85); text-transform: uppercase; letter-spacing: 0.04em; }
  input {
    width: 100%; padding: 0 0 7px; border: none; border-bottom: 1.5px solid rgba(255,255,255,0.4);
    font-size: 14px; font-family: inherit; margin-bottom: 20px; color: white; background: transparent;
    transition: border-color 0.15s;
  }
  input::placeholder { color: rgba(255,255,255,0.5); }
  input:focus { outline: none; border-bottom-color: white; }
  input.field-error { border-bottom-color: var(--error); background: var(--error-bg); }
  button {
    width: 100%; color: white; border: none; padding: 11px; border-radius: 8px;
    font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, var(--red), var(--yellow));
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,0,0,0.25); }
  .error {
    color: white; font-size: 12.5px; margin-bottom: 14px; display: none;
    padding: 8px 11px; background: rgba(220,38,38,0.3); border-radius: 8px; font-weight: 600;
  }
  .footer-link { text-align: center; font-size: 12.5px; margin-top: 18px; color: rgba(255,255,255,0.8); }
  .footer-link a { color: white; font-weight: 800; text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .body-grid { grid-template-columns: 1fr; }
    .scroller { height: auto; }
    .scroll-step { position: static; animation: none; opacity: 1; margin-bottom: 10px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="logo-badge">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M8 5h8l4 4v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="#FFFFFF"/>
        <path d="M16 5l4 4h-4z" fill="#FEF3C7"/>
        <path d="M10 13l2.5 2.5 4.5-4.5" stroke="#EF4444" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <p class="wordmark">jobbot</p>
      <p class="tagline">Smarter resumes. Faster applications. Zero hassle.</p>
    </div>
  </div>

  <div class="body-grid">
    <div>
      <p class="flow-label-hdr">How it works</p>
      <div class="scroller">
        <div class="scroll-step">
          <div class="step-num n1">01</div>
          <div class="step-text">Upload your resume</div>
        </div>
        <div class="scroll-step">
          <div class="step-num n2">02</div>
          <div class="step-text">We match it to real postings</div>
        </div>
        <div class="scroll-step">
          <div class="step-num n3">03</div>
          <div class="step-text highlight">Resume rewritten to hit 90% ATS match</div>
        </div>
        <div class="scroll-step">
          <div class="step-num n4">04</div>
          <div class="step-text">You approve, then we apply</div>
        </div>
      </div>
    </div>

    <div>
      <h2>Log in to your account</h2>
      <div class="error" id="err"></div>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <button id="loginBtn">Log in</button>
      <div class="footer-link">No account yet? <a href="/signup">Sign up</a></div>
    </div>
  </div>
</div>
<script>
function clearFieldErrors() {
  document.getElementById('email').classList.remove('field-error');
  document.getElementById('password').classList.remove('field-error');
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  clearFieldErrors();

  if (!email) { emailInput.classList.add('field-error'); emailInput.focus(); return; }
  if (!password) { passwordInput.classList.add('field-error'); passwordInput.focus(); return; }

  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (data.error) {
      err.textContent = data.error;
      err.style.display = 'block';
      emailInput.classList.add('field-error');
      passwordInput.classList.add('field-error');
    } else { window.location.href = '/'; }
  } catch (e) { err.textContent = 'Something went wrong. Try again.'; err.style.display = 'block'; }
});

['email', 'password'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    document.getElementById(id).classList.remove('field-error');
  });
});
document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
</script>
</body>
</html>
