<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobBot | Smarter resumes. Faster applications.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090D16;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366F1;
      --primary-gradient: linear-gradient(135deg, #6366F1 0%, #06B6D4 100%);
      --accent: #06B6D4;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --radius-lg: 20px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.5rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      background: var(--primary-gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .logo-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .tagline-pill {
      font-size: 0.82rem;
      color: var(--accent);
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      padding: 4px 12px;
      border-radius: 50px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .container {
      max-width: 1280px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2.5rem;
      align-items: center;
      flex: 1;
    }

    @media (max-width: 960px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Login Box */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .auth-card h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .auth-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 6px;
    }

    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--primary-gradient);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      transition: opacity 0.2s;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      opacity: 0.92;
    }

    .switch-link {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .switch-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    /* Presentation Showcase Frame */
    .deck-preview-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .deck-header span {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .deck-frame-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #000;
    }

    .deck-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .deck-actions {
      display: flex;
      justify-content: flex-end;
    }

    .deck-link-btn {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .deck-link-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo-container">
      <div class="logo-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <div>
        <div class="logo-title">JobBot</div>
      </div>
    </a>
    <div class="tagline-pill">Smarter resumes. Faster applications. Zero hassle.</div>
  </header>

  <main class="container">
    <!-- Login Form Section -->
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p>Log in to access your automated job matches & tailored applications.</p>

      {% if error %}
        <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #FCA5A5; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1.25rem;">
          {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="/auth/login">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="name@company.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <div class="switch-link">
        Don't have an account? <a href="/auth/signup">Create an account</a>
      </div>
    </div>

    <!-- Embedded Presentation Deck -->
    <div class="deck-preview-card">
      <div class="deck-header">
        <span>Product Overview & Process Deck</span>
        <a href="/deck" target="_blank" class="deck-link-btn">Open Fullscreen ↗</a>
      </div>
      <div class="deck-frame-container">
        <iframe src="/deck" title="JobBot Product Deck"></iframe>
      </div>
    </div>
  </main>

</body>
</html>
