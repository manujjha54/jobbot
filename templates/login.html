<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Job Search Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16243F; --indigo: #4F46E5; --violet: #7C3AED; --brass: #B37B2E;
    --paper: #F6F5F1; --panel: #FFFFFF; --line: #DAD5C8; --muted: #6E6A5E; --reject: #8C3B32;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif; background: var(--paper); color: var(--ink);
    display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); width: 380px; padding: 36px 36px 32px;
    position: relative;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--indigo), var(--violet));
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .wordmark { font-family: 'Source Serif 4', serif; font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .tagline { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  h1 {
    font-family: 'Source Serif 4', serif; font-size: 17px; font-weight: 600; margin: 0 0 22px;
    letter-spacing: -0.01em; color: var(--ink);
  }
  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: var(--paper);
    font-size: 14px; font-family: inherit; margin-bottom: 16px; color: var(--ink);
  }
  input:focus { outline: 2px solid var(--indigo); outline-offset: -1px; background: white; }
  button {
    width: 100%; background: var(--ink); color: white; border: none; padding: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button:hover { background: #0E1929; }
  .error {
    color: var(--reject); font-size: 13px; margin-bottom: 14px; display: none;
    padding: 8px 10px; background: #FBF0EE; border-left: 2px solid var(--reject);
  }
  .footer-link { text-align: center; font-size: 13px; margin-top: 20px; color: var(--muted); }
  .footer-link a { color: var(--indigo); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="36" height="36" rx="9" fill="url(#logoGrad)"/>
      <path d="M12 9h8l4 4v13a1 1 0 0 1-1 1H12a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1z" fill="white"/>
      <path d="M20 9l4 4h-4z" fill="#D7D3FF"/>
      <path d="M14.5 19.5l3 3 6-6" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
          <stop stop-color="#4F46E5"/>
          <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
      </defs>
    </svg>
    <div>
      <div class="wordmark">jobbot</div>
      <div class="tagline">Smarter resumes. Faster applications. Zero hassle.</div>
    </div>
  </div>
  <h1>Log in to your account</h1>
  <div class="error" id="err"></div>
  <label for="email">Email</label>
  <input type="email" id="email" autocomplete="email">
  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="current-password">
  <button id="loginBtn">Log in</button>
  <div class="footer-link">No account yet? <a href="/signup">Sign up</a></div>
</div>
<script>
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (data.error) { err.textContent = data.error; err.style.display = 'block'; }
    else { window.location.href = '/'; }
  } catch (e) { err.textContent = 'Something went wrong. Try again.'; err.style.display = 'block'; }
});
document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
</script>
</body>
</html>
