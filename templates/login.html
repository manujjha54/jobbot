<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jobbot — Smarter resumes. Faster applications.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1E40AF; --primary-hover: #1B3691; --primary-light: #EEF2FF; --primary-mid: #C7D2FE;
    --bg: #F8FAFC; --panel: #FFFFFF; --line: #E5E7EB; --text: #1F2937; --muted: #6B7280;
    --error: #DC2626; --error-bg: #FEF2F2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', -apple-system, sans-serif; color: var(--text); background: var(--bg);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;
  }
  .page { width: 100%; max-width: 460px; }

  .brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 8px; }
  .logo-badge {
    width: 40px; height: 40px; border-radius: 10px; background: var(--primary); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .wordmark { font-family: 'Source Serif 4', serif; font-size: 21px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .tagline { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .brand-text { text-align: left; }

  /* Compact horizontal workflow strip - swift, single-color, integrated into the page */
  .flow-strip {
    display: flex; justify-content: space-between; gap: 4px; margin: 28px 0 24px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 14px;
  }
  .flow-step { flex: 1; text-align: center; position: relative; }
  .flow-step:not(:last-child)::after {
    content: ''; position: absolute; top: 15px; left: 58%; width: 84%; height: 1.5px; background: var(--primary-mid);
  }
  .flow-icon {
    width: 30px; height: 30px; border-radius: 50%; background: var(--primary-light); color: var(--primary);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; font-size: 13px; font-weight: 700;
    position: relative; z-index: 1; border: 1.5px solid var(--primary-mid);
  }
  .flow-label { font-size: 10.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .flow-sub { font-size: 9.5px; color: var(--muted); margin-top: 1px; line-height: 1.3; }
  .flow-highlight .flow-icon { background: var(--primary); color: white; border-color: var(--primary); }
  .flow-highlight .flow-label { color: var(--primary); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 32px 32px 30px; }
  .card h2 { font-size: 17px; font-weight: 700; margin: 0 0 20px; text-align: center; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  input {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: inherit; margin-bottom: 16px; color: var(--text); background: white;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  input.field-error { border-color: var(--error); background: var(--error-bg); }
  input.field-error:focus { box-shadow: 0 0 0 3px rgba(220,38,38,0.12); }
  button {
    width: 100%; background: var(--primary); color: white; border: none; padding: 12px;
    border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: background 0.15s;
  }
  button:hover { background: var(--primary-hover); }
  .error {
    color: var(--error); font-size: 13px; margin-bottom: 14px; display: none;
    padding: 9px 12px; background: var(--error-bg); border-radius: 8px; font-weight: 500;
  }
  .footer-link { text-align: center; font-size: 13px; margin-top: 20px; color: var(--muted); }
  .footer-link a { color: var(--primary); font-weight: 700; text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .flow-step:not(:last-child)::after { display: none; }
    .flow-label, .flow-sub { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="logo-badge">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M8 5h8l4 4v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="white"/>
        <path d="M16 5l4 4h-4z" fill="var(--primary-mid)"/>
        <path d="M10 13l2.5 2.5 4.5-4.5" stroke="#1E40AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-text">
      <div class="wordmark">jobbot</div>
      <div class="tagline">Smarter resumes. Faster applications. Zero hassle.</div>
    </div>
  </div>

  <div class="flow-strip">
    <div class="flow-step">
      <div class="flow-icon">1</div>
      <div class="flow-label">Upload resume</div>
      <div class="flow-sub">Read once</div>
    </div>
    <div class="flow-step">
      <div class="flow-icon">2</div>
      <div class="flow-label">Match jobs</div>
      <div class="flow-sub">Scored, not guessed</div>
    </div>
    <div class="flow-step flow-highlight">
      <div class="flow-icon">3</div>
      <div class="flow-label">Hit 90% ATS</div>
      <div class="flow-sub">Auto-tailored</div>
    </div>
    <div class="flow-step">
      <div class="flow-icon">4</div>
      <div class="flow-label">Apply &amp; track</div>
      <div class="flow-sub">You approve first</div>
    </div>
  </div>

  <div class="card">
    <h2>Log in to your account</h2>
    <div class="error" id="err"></div>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
    <button id="loginBtn">Log in</button>
    <div class="footer-link">No account yet? <a href="/signup">Sign up</a></div>
  </div>
</div>
<script>
function clearFieldErrors() {
  document.getElementById('email').classList.remove('field-error');
  document.getElementById('password').classList.remove('field-error');
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  clearFieldErrors();

  if (!email) { emailInput.classList.add('field-error'); emailInput.focus(); return; }
  if (!password) { passwordInput.classList.add('field-error'); passwordInput.focus(); return; }

  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (data.error) {
      err.textContent = data.error;
      err.style.display = 'block';
      emailInput.classList.add('field-error');
      passwordInput.classList.add('field-error');
    } else { window.location.href = '/'; }
  } catch (e) { err.textContent = 'Something went wrong. Try again.'; err.style.display = 'block'; }
});

['email', 'password'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    document.getElementById(id).classList.remove('field-error');
  });
});
document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
</script>
</body>
</html>
